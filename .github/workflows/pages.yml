name: Publish Vaulton installation site

on:
  workflow_dispatch:
  repository_dispatch:
    types: [vaulton-release-assets-ready]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install repository metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c rpm

      - name: Build validated APT and DNF repositories
        shell: bash
        env:
          VAULTON_REPO_SIGNING_KEY_BASE64: ${{ secrets.VAULTON_REPO_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html install.sh install.ps1 _site/
          if [[ -f keys/vaulton-archive-keyring.gpg ]]; then mkdir -p _site/keys; cp keys/vaulton-archive-keyring.gpg _site/keys/; fi
          api='https://api.github.com/repos/ericg2/Vaulton-UI/releases/latest'
          release="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H 'User-Agent: Vaulton-Pages' "$api")"
          tag="$(jq -r '.tag_name' <<<"$release")"
          version="${tag#v}"
          [[ -n "$version" && "$version" != "$tag" ]] || { echo "Unexpected release tag: $tag"; exit 1; }

          deb_name="vaulton-${version}-linux-amd64.deb"
          rpm_name="vaulton-${version}-linux-x86_64.rpm"
          deb_url="$(jq -r --arg n "$deb_name" '.assets[] | select(.name == $n) | .browser_download_url' <<<"$release" | head -n1)"
          rpm_url="$(jq -r --arg n "$rpm_name" '.assets[] | select(.name == $n) | .browser_download_url' <<<"$release" | head -n1)"
          if [[ -z "$deb_url" ]]; then
            deb_url="$(jq -r '.assets[] | select(.name == "Vaulton-Linux.deb") | .browser_download_url' <<<"$release" | head -n1)"
          fi
          if [[ -z "$rpm_url" ]]; then
            rpm_url="$(jq -r '.assets[] | select(.name == "Vaulton-Linux.rpm") | .browser_download_url' <<<"$release" | head -n1)"
          fi

          available=false
          if [[ -n "$deb_url" && -n "$rpm_url" ]]; then
            mkdir -p /tmp/vaulton-release
            curl -fsSL "$deb_url" -o "/tmp/vaulton-release/vaulton.deb"
            curl -fsSL "$rpm_url" -o "/tmp/vaulton-release/vaulton.rpm"
            deb_version="$(dpkg-deb -f /tmp/vaulton-release/vaulton.deb Version 2>/dev/null || true)"
            rpm_version="$(rpm -qp --qf '%{VERSION}' /tmp/vaulton-release/vaulton.rpm 2>/dev/null || true)"
            if [[ ( "$deb_version" == "$version" || "$deb_version" == "$version-1" ) && "$rpm_version" == "$version" ]]; then
              dpkg-deb --contents /tmp/vaulton-release/vaulton.deb > /tmp/vaulton-release/deb-files.txt
              rpm -qpl /tmp/vaulton-release/vaulton.rpm > /tmp/vaulton-release/rpm-files.txt
              if grep -q 'libdesktop_drop_plugin.so' /tmp/vaulton-release/deb-files.txt &&
                 grep -q 'flutter_assets' /tmp/vaulton-release/deb-files.txt &&
                 grep -q 'libdesktop_drop_plugin.so' /tmp/vaulton-release/rpm-files.txt &&
                 grep -q 'flutter_assets' /tmp/vaulton-release/rpm-files.txt; then
                available=true
              fi
            fi
            if [[ "$available" != true ]]; then
              echo "Latest release $tag has incomplete or mismatched Linux packages; repository publication is withheld."
            fi
          else
            echo "Latest release $tag does not yet have both Linux packages."
          fi

          if [[ "$available" == true ]]; then
            mkdir -p _site/apt/pool/main/v/vaulton _site/apt/dists/stable/main/binary-amd64 _site/rpm
            cp /tmp/vaulton-release/vaulton.deb "_site/apt/pool/main/v/vaulton/vaulton_${deb_version}_amd64.deb"
            cp /tmp/vaulton-release/vaulton.rpm "_site/rpm/vaulton-${version}-1.x86_64.rpm"
            (
              cd _site/apt
              dpkg-scanpackages --arch amd64 pool /dev/null > dists/stable/main/binary-amd64/Packages
              gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz
              cat > dists/stable/Release <<EOF
          Origin: Vaulton
          Label: Vaulton
          Suite: stable
          Codename: stable
          Architectures: amd64
          Components: main
          Description: Vaulton desktop application packages
          EOF
              apt-ftparchive release dists/stable >> dists/stable/Release
            )
            if [[ -n "${VAULTON_REPO_SIGNING_KEY_BASE64:-}" ]]; then
              test -s _site/keys/vaulton-archive-keyring.gpg || { echo "Repository signing secret is set but the public key file is missing."; exit 1; }
              mkdir -m 700 /tmp/vaulton-gnupg
              export GNUPGHOME=/tmp/vaulton-gnupg
              printf '%s' "$VAULTON_REPO_SIGNING_KEY_BASE64" | base64 --decode > /tmp/vaulton-private.asc
              chmod 600 /tmp/vaulton-private.asc
              gpg --batch --import /tmp/vaulton-private.asc
              fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
              public_fingerprint="$(gpg --batch --show-keys --with-colons _site/keys/vaulton-archive-keyring.gpg | awk -F: '$1 == "fpr" {print $10; exit}')"
              [[ -n "$fingerprint" && "$fingerprint" == "$public_fingerprint" ]] || { echo "Public and private repository signing keys do not match."; exit 1; }

              rpm_file="$(find _site/rpm -maxdepth 1 -name '*.rpm' -print -quit)"
              test -n "$rpm_file"
              rpm --import _site/keys/vaulton-archive-keyring.gpg
              rpmsign --define "_gpg_name $fingerprint" --addsign "$rpm_file"

              gpg --batch --yes --local-user "$fingerprint" --clearsign --output _site/apt/dists/stable/InRelease _site/apt/dists/stable/Release
              gpg --batch --yes --local-user "$fingerprint" --armor --detach-sign --output _site/apt/dists/stable/Release.gpg _site/apt/dists/stable/Release
            fi
            createrepo_c --database _site/rpm
            if [[ -n "${VAULTON_REPO_SIGNING_KEY_BASE64:-}" ]]; then
              gpg --batch --yes --local-user "$fingerprint" --armor --detach-sign --output _site/rpm/repodata/repomd.xml.asc _site/rpm/repodata/repomd.xml
            fi
          fi

          signed=false
          [[ -n "${VAULTON_REPO_SIGNING_KEY_BASE64:-}" && "$available" == true ]] && signed=true
          printf '{"available":%s,"version":"%s","signed":%s}\n' "$available" "$version" "$signed" > _site/repo-status.json
          printf 'Published Vaulton %s; Linux repositories available: %s\n' "$version" "$available"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Let the branch-based Pages build finish first
        if: github.event_name == 'push'
        run: sleep 60

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
